name: Verschlüsselte Seite veröffentlichen

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Verschlüsselte index.html bauen
        env:
          BENUTZERKENNUNG: ${{ secrets.BENUTZERKENNUNG }}
          PASSWORT: ${{ secrets.PASSWORT }}
          APP_B64: ${{ secrets.APP_B64 }}
        run: node build.mjs

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - id: deployment
        uses: actions/deploy-pages@v4
