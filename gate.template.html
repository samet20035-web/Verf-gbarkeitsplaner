<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#00254c">
<meta name="robots" content="noindex, nofollow">
<meta name="format-detection" content="telephone=no">
<title>Verfügbarkeitsplaner</title>
<link rel="icon" type="image/png" href="__ICON__">
<link rel="apple-touch-icon" href="__ICON__">
<style>
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; display: grid; place-items: center; padding: 20px;
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: linear-gradient(160deg, #00254c 0%, #0a3a6b 100%);
    color: #1f2a37; -webkit-font-smoothing: antialiased;
  }
  .card { width: min(400px, 100%); background: #fff; border-radius: 22px; padding: 28px 24px 24px; box-shadow: 0 24px 60px rgba(0,0,0,.35); }
  .logo { display: block; width: 76px; height: 76px; margin: 0 auto 14px; border-radius: 20px; box-shadow: 0 6px 18px rgba(0,37,76,.25); }
  h1 { margin: 0 0 4px; text-align: center; font-size: 1.3rem; color: #00254c; letter-spacing: -.01em; }
  p.sub { margin: 0 0 20px; text-align: center; color: #64748b; font-size: .92rem; }
  label { display: block; margin-bottom: 14px; }
  label span { display: block; margin-bottom: 6px; font-size: .78rem; font-weight: 700; color: #64748b; }
  input { width: 100%; min-height: 50px; padding: 10px 14px; font: inherit; font-size: 18px; letter-spacing: .08em; border: 1px solid #cbd5e1; border-radius: 12px; background: #fff; color: inherit; -webkit-appearance: none; appearance: none; }
  input:focus { outline: 3px solid rgba(238,114,2,.25); border-color: #ee7202; }
  button { width: 100%; min-height: 52px; margin-top: 4px; border: 0; border-radius: 12px; background: #ee7202; color: #fff; font: inherit; font-weight: 700; font-size: 1.02rem; cursor: pointer; box-shadow: 0 8px 18px rgba(238,114,2,.3); touch-action: manipulation; }
  button:disabled { opacity: .65; cursor: default; }
  .err { min-height: 22px; margin: 12px 0 0; text-align: center; color: #b42318; font-size: .9rem; font-weight: 600; }
</style>
</head>
<body>
<form class="card" id="f" autocomplete="on">
  <img class="logo" src="__ICON__" alt="">
  <h1>Verfügbarkeitsplaner</h1>
  <p class="sub">Bitte anmelden</p>
  <label><span>Benutzerkennung</span>
    <input id="u" name="username" type="text" inputmode="numeric" pattern="[0-9]*" autocomplete="username" autocapitalize="off" autocorrect="off" spellcheck="false" required>
  </label>
  <label><span>Passwort</span>
    <input id="p" name="password" type="password" inputmode="numeric" pattern="[0-9]*" autocomplete="current-password" required>
  </label>
  <button type="submit" id="b">Anmelden</button>
  <div class="err" id="e" role="alert" aria-live="polite"></div>
</form>
<script>
(function () {
  'use strict';
  var PAYLOAD = '__PAYLOAD__';
  var ITER = __ITER__;
  var f = document.getElementById('f'), u = document.getElementById('u'), p = document.getElementById('p'),
      b = document.getElementById('b'), e = document.getElementById('e');

  function fromB64(s) { var bin = atob(s), a = new Uint8Array(bin.length); for (var i = 0; i < bin.length; i++) a[i] = bin.charCodeAt(i); return a; }

  async function decrypt(pass) {
    var raw = fromB64(PAYLOAD), salt = raw.slice(0, 16), iv = raw.slice(16, 28), ct = raw.slice(28);
    var km = await crypto.subtle.importKey('raw', new TextEncoder().encode(pass), 'PBKDF2', false, ['deriveKey']);
    var key = await crypto.subtle.deriveKey({ name: 'PBKDF2', salt: salt, iterations: ITER, hash: 'SHA-256' }, km, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
    var pt = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: iv }, key, ct);
    return new TextDecoder().decode(pt);
  }

  f.addEventListener('submit', async function (ev) {
    ev.preventDefault();
    e.textContent = '';
    if (!window.crypto || !crypto.subtle) { e.textContent = 'Bitte die Seite über https:// öffnen.'; return; }
    b.disabled = true; b.textContent = 'Wird geprüft …';
    try {
      var html = await decrypt(u.value.replace(/\s/g, '') + ':' + p.value.replace(/\s/g, ''));
      document.open(); document.write(html); document.close();
    } catch (err) {
      e.textContent = 'Kennung oder Passwort falsch.';
      p.value = ''; p.focus();
      b.disabled = false; b.textContent = 'Anmelden';
    }
  });
  u.focus();
})();
</script>
</body>
</html>
